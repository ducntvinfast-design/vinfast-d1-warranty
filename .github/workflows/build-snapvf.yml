name: Build SnapVF.exe

on:
  push:
    branches: [claude/snapvf-screenshot-tool]
    paths: ["SnapVF/**", ".github/workflows/build-snapvf.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: SnapVF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed --name SnapVF
          --hidden-import pystray._win32
          --hidden-import pynput.keyboard._win32
          --hidden-import pynput.mouse._win32
          snapvf.py
      - uses: actions/upload-artifact@v4
        with:
          name: SnapVF-exe
          path: SnapVF/dist/SnapVF.exe
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snapvf-latest
          name: SnapVF - phan mem chup man hinh
          body: "Tải file SnapVF.exe bên dưới, nhấp đúp để chạy. Không cần cài Python."
          files: SnapVF/dist/SnapVF.exe
          make_latest: true
